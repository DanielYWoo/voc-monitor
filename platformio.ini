; PlatformIO Project Configuration File
; VoC Monitor for 3D Printer Enclosures
;
; Build: pio run
; Upload: pio run --target upload
; Monitor: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Library dependencies
lib_deps = 
    olikraus/U8g2@^2.35.0                                    ; 128x64 LCD driver
    adafruit/Adafruit AHTX0@^2.0.3                           ; AHT20 temperature/humidity sensor
    sparkfun/SparkFun Indoor Air Quality Sensor - ENS160@^1.0.0  ; ENS160 VOC sensor
    bblanchon/ArduinoJson@^6.21.0                            ; JSON for WiFi communication
    adafruit/DHT sensor library@^1.4.4                       ; DHT11 backup sensor
    adafruit/Adafruit Unified Sensor@^1.1.9                  ; Required by DHT library

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0

; Upload settings for ESP32-WROOM-32E
; If upload fails, try lowering upload_speed to 460800 or 115200
upload_port = /dev/cu.usbserial-*
; For Windows: upload_port = COM*
; For Linux: upload_port = /dev/ttyUSB*

; Monitor filters for better output
monitor_filters = 
    esp32_exception_decoder
    time